name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate app
        run: pnpm check
      - name: Install Java 21 for reviewed curriculum fixtures
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and verify all reviewed Java lessons and question keys
        run: node apps/web/tests/java-snippets.mjs
      - name: Exercise production HTTP routes and grading
        run: node apps/web/tests/http-smoke.mjs
      - name: Check responsive viewport widths in headless Chrome
        run: node apps/web/tests/responsive-smoke.mjs
