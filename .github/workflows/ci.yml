name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate app
        run: corepack pnpm check
      - name: Install Java 21 for reviewed curriculum fixtures
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and verify all reviewed Java lessons and question keys
        run: node apps/web/tests/java-snippets.mjs
      - name: Install Python 3.12 for reviewed curriculum fixtures
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all reviewed Python lesson examples and verify private answer keys
        run: node apps/web/tests/python-snippets.mjs
      - name: Verify 15 M9 Python applied problems and five independent programs in Python 3.12
        run: node apps/web/tests/python-applied-runtime.mjs
      - name: Verify M9 pilot form answer keys with real Python 3.12 (trusted fixtures only)
        run: node apps/web/tests/m9-python-pilot-runtime.mjs
      - name: Verify 30 M9 JavaScript and Java applied programs plus 20 independent reference cases
        run: node apps/web/tests/cross-language-applied-runtime.mjs
      - name: Verify reviewed bugfix explanations against real Java and Python
        run: node apps/web/tests/bugfix-fixtures.mjs
      - name: Execute counterfactual transfer cases in real Java, Python and Node runtimes
        run: node apps/web/tests/transfer-runtime-fixtures.mjs
      - name: Execute every Learning Studio trace in real Java, Python and Node runtimes
        run: node apps/web/tests/studio-runtime-fixtures.mjs
      - name: Exercise production HTTP routes and grading
        run: node apps/web/tests/http-smoke.mjs
      - name: Check responsive viewport widths in headless Chrome
        run: node apps/web/tests/responsive-smoke.mjs
      - name: Measure real browser and editor chunk cost
        run: node apps/web/tests/performance-probe.mjs
      - name: Store browser performance report
        uses: actions/upload-artifact@v4
        with:
          name: m8-0c-browser-${{ github.sha }}
          path: apps/web/perf-results.json
          retention-days: 14
