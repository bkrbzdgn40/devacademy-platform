name: Dependency security audit
on:
  pull_request:
    paths:
      - "package.json"
      - "apps/web/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/dependency-security.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "apps/web/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/dependency-security.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Audit production dependencies (high / critical)
        run: pnpm audit --prod --audit-level high
