name: Isolated runner prototype
on:
  pull_request:
    paths:
      - "services/code-runner/**"
      - "apps/web/src/server/execution-store.mjs"
      - "apps/web/src/server/execution-worker-auth.mjs"
      - "apps/web/src/app/api/executions/**"
      - "apps/web/src/app/api/internal/executions/**"
      - "apps/web/tests/*queue.integration.mjs"
      - "apps/web/src/data/practice.json"
      - "db/migrations/0003_execution_queue.sql"
      - "db/migrations/0004_code_assessment.sql"
      - "db/migrations/0006_multilang_lab.sql"
      - ".github/workflows/runner-isolation.yml"
  push:
    branches: [main]
    paths:
      - "services/code-runner/**"
      - "apps/web/src/server/execution-store.mjs"
      - "apps/web/src/server/execution-worker-auth.mjs"
      - "apps/web/src/app/api/executions/**"
      - "apps/web/src/app/api/internal/executions/**"
      - "apps/web/tests/*queue.integration.mjs"
      - "apps/web/src/data/practice.json"
      - "db/migrations/0003_execution_queue.sql"
      - "db/migrations/0004_code_assessment.sql"
      - "db/migrations/0006_multilang_lab.sql"
      - ".github/workflows/runner-isolation.yml"
permissions:
  contents: read
jobs:
  sandbox-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check worker protocol and pinned runtime policy
        run: node --test services/code-runner/tests/worker-contract.test.mjs services/code-runner/tests/evaluator.test.mjs services/code-runner/tests/multilang-evaluator.test.mjs
      - name: Pull development-only Node runtime image
        run: docker pull node:24-alpine
      - name: Pull development-only Python and Java runtime images
        run: |
          docker pull python:3.12-alpine
          docker pull eclipse-temurin:21-jdk-alpine
      - name: Exercise sandbox in disposable Docker environments
        run: |
          node services/code-runner/tests/isolation-smoke.mjs
          node services/code-runner/tests/assessment-docker-smoke.mjs
          node services/code-runner/tests/multilang-docker-smoke.mjs
          node services/code-runner/tests/code-transfer-docker-smoke.mjs
      - name: Measure isolated Docker startup and runtime cost
        run: node services/code-runner/tests/performance-probe.mjs
      - name: Store isolated runtime performance report
        uses: actions/upload-artifact@v4
        with:
          name: m8-0c-runner-${{ github.sha }}
          path: services/code-runner/perf-results.json
          retention-days: 14
